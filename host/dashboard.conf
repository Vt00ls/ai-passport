# Configuration for host/ble_central.py.
#
# Nothing here is a secret and no address is hardcoded: the badge is found by its
# advertised service UUID, falling back to its advertised name. Override any value
# on the command line instead of editing this file if you only need a one-off run.

[dashboard]
# Must match DASHBOARD_DEVICE_NAME in main/app_dashboard/dashboard_ble.h.
device_name = PassportDash

# Must match the UUIDs in main/app_dashboard/dashboard_ble.c.
service_uuid = 1f7a0001-6b3c-4a1e-9c2d-5e8f0a9b4c10
characteristic_uuid = 1f7a0002-6b3c-4a1e-9c2d-5e8f0a9b4c10

# One frame per interval; the badge shows "stale" after 15 s and "lost" after 120 s,
# so keep this well below 15.
interval_s = 5

connect_timeout_s = 20
retry_delay_s = 5
max_retry_delay_s = 60

# Empty means the collector default (~/.pi/agent/sessions). Set it explicitly when
# the service runs as a user whose home differs from the one running the agents.
sessions_dir =
